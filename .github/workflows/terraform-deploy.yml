name: CI/CD - Terraform & SSM Deployment

on:
  push:
    branches:
      - main
      - production

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    
    env:
      PROJECT_NAME: "terraform-aws-webapp-setup" 
      S3_BUCKET: "terraform-aws-webapp-setup-static-content-4ec3ab3c"

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init/Plan/Apply
        run: |
          terraform init
          terraform plan -out=tfplan \
            -var-file="${{ github.ref_name }}.tfvars" \
            -var="ami_id=${{ secrets.PROD_AMI_ID }}" \
            -var="key_pair_name=${{ secrets.KEY_PAIR_NAME }}"
          terraform apply -auto-approve tfplan

      - name: Upload Static Content to S3
        working-directory: ./ # Run from root to find your /public folder
        run: |
          echo "Syncing static assets to S3..."
          aws s3 sync ./public "s3://${{ env.S3_BUCKET }}/static/" --delete --region us-east-1

      - name: Deploy App Code via SSM
        working-directory: ./
        run: |
          echo "Fetching Healthy Instance IDs from ASG..."
          
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.PROJECT_NAME }}-asg" \
            --query 'AutoScalingGroups[0].Instances[?HealthStatus==`Healthy`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" == "None" ]; then
            echo "❌ Error: No healthy instances found in ASG. Check AWS Console."
            exit 1
          fi

          echo "🚀 Deploying to Instances: $INSTANCE_IDS"

          # Single SSM command to update code and restart the process
          aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "Update code and restart node-app" \
            --parameters '{
              "commands": [
                "cd /home/ubuntu/app",
                "sudo git pull origin ${{ github.ref_name }}",
                "npm install --production",
                "pm2 restart node-app || pm2 start index.js --name node-app",
                "pm2 save"
              ]
            }'

      - name: Verify Production Health
        run: |
          echo "Waiting for app restart..."
          sleep 20
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "Testing health endpoint at http://$ALB_DNS/health"
          curl -f http://$ALB_DNS/health || exit 1

      - name: Notify Status
        if: always()
        run: |
          echo "Deployment to ${{ github.ref_name }} finished with status: ${{ job.status }}"