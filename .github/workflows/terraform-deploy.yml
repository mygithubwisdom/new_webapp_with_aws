name: CI/CD - Terraform Deploy to EC2

on:
  push:
    branches: [ "main" ]   # Trigger deployment on push to main
  workflow_dispatch:        # Allow manual trigger

permissions:
  id-token: write           # Required for OIDC authentication
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
        AWS_REGION: 'us-east-1'

    steps:
      # Step 1: Get the code
      # Reason: Pulls your latest code from GitHub so the workflow runs on it.
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2:
      # ✅ Configure AWS credentials via GitHub OIDC
      # Reason: Allows the workflow to authenticate with AWS securely without storing long-lived credentials. 
      # It uses OpenID Connect (OIDC) to assume a specified IAM role. It is more secure and manageable.
        uses: aws-actions/configure-aws-credentials@v4
        with:
           role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
           aws-region: ${{ env.AWS_REGION }}  

      # Step 3: Install Terraform
      # ✅ Setup Terraform CLI to run infrastructure commands.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5   # or your preferred version  
        
      # Format Terraform code  
      # Step 4: Format Terraform code
      - name: Format Terraform files
        id: fmt_recursive
        run: terraform fmt -recursive
        working-directory: ./terraform
      
      - name: Terraform format check
        id: fmt_check
        run: terraform fmt -check
        working-directory: ./terraform
    
      # Steps 5: Validate Terraform code      
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      # Step 6:
      # ✅ Security scan with Trivy
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ./terraform
      # Triva is the newer, bigger tool that does what tfsec did (IaC scanning) plus more (container scanning, secrets scanning, etc.). In your workflow, it will check the Terraform code for insecure configurations. (Think of it as a security guard for both your code and infrastructure.)
            # - name: Terraform Security Scan
            #   run: TSec ./terraform this isn't needed because we are using Trivia

      # Step 7:
      # ✅ Initialize and validate Terraform
      #  Reason: Downloads required providers (like AWS) and sets up the working directory.
      # Reason: Validates that the Terraform code is syntactically correct and ready to run.
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      # Step 8:
      # ✅ Plan infrastructure changes
      - name: Terraform Plan
        run: |
           terraform plan -out=tfplan \
             -var="ami_id=ami-0360c520857e3138f" \
             -var="key_pair_name=${{ secrets.KEY_PAIR_NAME }}" \
             -var="SSH_laptop_ip=${{ secrets.SSH_LAPTOP_IP }}"

        working-directory: ./terraform

      #  Step 9:
      # ✅ Apply infrastructure changes
      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
             -var="ami_id=ami-0360c520857e3138f" \
             -var="key_pair_name=${{ secrets.KEY_PAIR_NAME }}" \
             -var="SSH_laptop_ip=${{ secrets.SSH_LAPTOP_IP }}"

        working-directory: ./terraform
      
      # Step 10:
      # ✅ Deploy application to EC2 instance
      - name: Get EC2 public IP
        id: ec2        
        run: |
          IP=$(terraform output -raw public_ip)
          echo "public_ip=$IP" >> $GITHUB_ENV
          echo "EC2 Public IP: $IP"
        working-directory: ./terraform  
      
       # Steps 11:
      - name: Prepare SSH key file and run remote apt update
        run: |
          mkdir -p /home/runner/.ssh 
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > /home/runner/.ssh/SSH_PRIVATE_KEY.pem
          chmod 600 /home/runner/.ssh/SSH_PRIVATE_KEY.pem
          ssh -i /home/runner/.ssh/SSH_PRIVATE_KEY.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ env.public_ip }} sudo apt update
      
         # # add before running the deploy script
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
            node-version: 18

          # # run the deploy script from the runner and pass EC2 host and SSH key path
      - name: run deploy script from runner
        run: |
          chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh "${{ env.public_ip }}" /home/runner/.ssh/SSH_PRIVATE_KEY.pem
        working-directory: ./terraform    
      
        # ✅ Verify deployment health
      - name: Verify deployment
        run: |
          echo "Waiting for app to start..."
          sleep 15
          curl -f http://${{ secrets.EC2_HOST }}:3000/health || exit 1

      # ✅ Notify result
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
